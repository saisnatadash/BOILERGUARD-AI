name: boilerguard-ai

# Local full-stack run: PostgreSQL + FastAPI + Next.js.
# Start with:  docker compose up --build
# Then open http://localhost:3000 and sign in with a demonstration account (see README).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-boilerguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-boilerguard-local}
      POSTGRES_DB: ${POSTGRES_DB:-boilerguard}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-boilerguard} -d ${POSTGRES_DB:-boilerguard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-boilerguard}:${POSTGRES_PASSWORD:-boilerguard-local}@db:5432/${POSTGRES_DB:-boilerguard}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
      CORS_ORIGINS: http://localhost:3000
      SEED_DEMO_ON_START: "true"
      UPLOAD_DIR: /app/data/uploads
      REPORT_DIR: /app/data/reports
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/data

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
  uploads:
